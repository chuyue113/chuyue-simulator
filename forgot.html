<!DOCTYPE html>
<html lang="zh-CN" data-theme="yuanshan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chuyue - 忘记密码</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #A8BEDF; --primary-dark: #8ba4cf; --primary-light: #c5d4ea;
    --accent: #C7D5E8; --accent-light: #d8e2f0;
    --bg-main: #F5F7FA; --bg-sidebar: #ECF0F5; --bg-card: #F8FAFC;
    --bg-hover: rgba(168, 190, 223, 0.1); --bg-active: rgba(168, 190, 223, 0.2);
    --text-primary: #4A5060; --text-secondary: #7A8090; --text-muted: #A8B0C0; --text-light: #C8D0D8;
    --border: #D8DFE8; --border-light: #E8EDF2;
    --shadow-soft: 0 4px 20px rgba(168, 190, 223, 0.15);
    --shadow-card: 0 6px 24px rgba(74, 80, 96, 0.06);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Serif SC", serif;
    background: var(--bg-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-primary);
  }
  .forgot-card {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-card);
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    margin: 20px;
    border: 1.5px solid var(--border);
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .forgot-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand {
    font-family: "Great Vibes", cursive;
    font-size: 36px;
    color: var(--primary-dark);
    margin-bottom: 8px;
  }
  .forgot-header h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .forgot-header p {
    font-size: 13px;
    color: var(--text-muted);
  }
  .steps {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .step {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    background: var(--bg-hover);
    color: var(--text-muted);
    border: 2px solid var(--border);
    transition: all 0.3s;
  }
  .step.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .step.completed {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .step-line {
    width: 30px;
    height: 2px;
    background: var(--border);
    align-self: center;
  }
  .form-section {
    display: none;
  }
  .form-section.active {
    display: block;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .form-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-main);
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
    outline: none;
  }
  .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(168, 190, 223, 0.15);
  }
  .email-row {
    display: flex;
    gap: 8px;
  }
  .email-row .form-input {
    flex: 1;
  }
  .btn-verify {
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--primary);
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    font-weight: 600;
  }
  .btn-verify:hover {
    background: var(--primary-dark);
  }
  .btn-verify:disabled {
    background: var(--text-light);
    border-color: var(--text-light);
    cursor: not-allowed;
  }
  .code-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .code-row .form-input {
    flex: 1;
  }
  .code-status {
    font-size: 20px;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .code-status.show {
    opacity: 1;
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-md);
    border: none;
    background: var(--text-primary);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-submit:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  .btn-submit:disabled {
    background: var(--text-light);
    cursor: not-allowed;
    transform: none;
  }
  .password-match {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .password-match .icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }
  .password-match.match .icon {
    background: #27ae60;
    color: #fff;
  }
  .password-match.match {
    color: #27ae60;
  }
  .password-match.mismatch .icon {
    background: #e74c3c;
    color: #fff;
  }
  .password-match.mismatch {
    color: #e74c3c;
  }
  .input-wrapper {
    position: relative;
  }
  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--text-muted);
    font-size: 16px;
    user-select: none;
  }
  .form-input.has-toggle {
    padding-right: 42px;
  }
  .result-section {
    text-align: center;
    padding: 20px 0;
    display: none;
  }
  .result-section.active {
    display: block;
    animation: fadeIn 0.5s ease;
  }
  .result-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }
  .result-icon.success {
    background: rgba(39, 174, 96, 0.1);
    color: #27ae60;
  }
  .result-icon.error {
    background: rgba(231, 76, 60, 0.1);
    color: #e74c3c;
  }
  .result-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .result-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .form-footer {
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }
  .form-footer a {
    color: var(--primary-dark);
    text-decoration: none;
    font-weight: 600;
  }
  .lang-switcher {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    background: var(--bg-card);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-soft);
    padding: 8px 12px;
    display: flex;
    gap: 4px;
    border: 1.5px solid var(--border);
  }
  .lang-btn {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1.5px solid transparent;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    transition: all 0.2s;
    font-family: inherit;
  }
  .lang-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .status-msg {
    font-size: 12px;
    margin-top: 6px;
    min-height: 18px;
  }
  .status-msg.error {
    color: #e74c3c;
  }
  .status-msg.success {
    color: #27ae60;
  }
  @media (max-width: 480px) {
    .forgot-card { margin: 12px; padding: 28px 20px; }
    .email-row { flex-direction: column; }
    .btn-verify { width: 100%; }
    .code-row { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="lang-switcher">
  <button class="lang-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">繁中</button>
  <button class="lang-btn active" data-lang="zh-CN" onclick="setLang('zh-CN')">简中</button>
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
  <button class="lang-btn" data-lang="vi" onclick="setLang('vi')">Tiếng Việt</button>
</div>

<div class="forgot-card">
  <div class="forgot-header">
    <div class="brand">Chuyue</div>
    <h1 data-i18n="forgot_title">找回密码</h1>
    <p data-i18n="forgot_subtitle">通过邮箱验证重置您的密码</p>
  </div>

  <div class="steps">
    <div class="step active" id="step1">1</div>
    <div class="step-line"></div>
    <div class="step" id="step2">2</div>
    <div class="step-line"></div>
    <div class="step" id="step3">3</div>
  </div>

  <!-- 步骤1：邮箱验证 -->
  <div class="form-section active" id="section1">
    <div class="form-group">
      <label class="form-label" data-i18n="email_label">注册邮箱</label>
      <div class="email-row">
        <input type="email" class="form-input" id="email" placeholder="example@email.com">
        <button class="btn-verify" id="btnSendCode" onclick="sendCode()" data-i18n="send_code">获取验证码</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="verify_code_label">验证码</label>
      <div class="code-row">
        <input type="text" class="form-input" id="verifyCode" placeholder="123456" maxlength="6" oninput="checkCode()">
        <span class="code-status" id="codeStatus">✓</span>
      </div>
    </div>
    <button class="btn-submit" onclick="goToStep2()" data-i18n="next_step">下一步</button>
  </div>

  <!-- 步骤2：重置密码 -->
  <div class="form-section" id="section2">
    <div class="form-group">
      <label class="form-label" data-i18n="new_password_label">新密码</label>
      <div class="input-wrapper">
        <input type="password" class="form-input has-toggle" id="newPassword" placeholder="••••••••" oninput="checkPasswordMatch()">
        <span class="toggle-password" onclick="togglePassword('newPassword')">👁</span>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="confirm_password_label">确认新密码</label>
      <div class="input-wrapper">
        <input type="password" class="form-input has-toggle" id="confirmPassword" placeholder="••••••••" oninput="checkPasswordMatch()">
        <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁</span>
      </div>
      <div class="password-match" id="passwordMatch">
        <span class="icon">?</span>
        <span data-i18n="password_check">请输入密码</span>
      </div>
    </div>
    <button class="btn-submit" id="btnReset" onclick="resetPassword()" disabled data-i18n="reset_password">重置密码</button>
  </div>

  <!-- 步骤3：结果 -->
  <div class="result-section" id="section3">
    <div class="result-icon success" id="resultIcon">✓</div>
    <div class="result-title" id="resultTitle" data-i18n="reset_success">密码重置成功！</div>
    <div class="result-desc" id="resultDesc" data-i18n="reset_success_desc">请使用新密码登录</div>
    <button class="btn-submit" onclick="location.href='login.html'" data-i18n="go_login">去登录</button>
  </div>

  <div class="form-footer">
    <span data-i18n="remember_password">想起密码了？</span>
    <a href="login.html" data-i18n="back_login">返回登录</a>
  </div>
</div>

<script>
const i18n = {
  'zh-CN': {
    forgot_title: '找回密码', forgot_subtitle: '通过邮箱验证重置您的密码',
    email_label: '注册邮箱', send_code: '获取验证码', verify_code_label: '验证码',
    next_step: '下一步', new_password_label: '新密码', confirm_password_label: '确认新密码',
    password_check: '请输入密码', password_match: '密码一致 ✓', password_mismatch: '密码不一致 ✗',
    reset_password: '重置密码', reset_success: '密码重置成功！', reset_success_desc: '请使用新密码登录',
    go_login: '去登录', remember_password: '想起密码了？', back_login: '返回登录',
    code_sent: '验证码已发送', code_verified: '验证通过 ✓', send_again: '重新发送',
    password_short: '密码至少需要6位'
  },
  'zh-TW': {
    forgot_title: '找回密碼', forgot_subtitle: '通過郵箱驗證重置您的密碼',
    email_label: '註冊郵箱', send_code: '獲取驗證碼', verify_code_label: '驗證碼',
    next_step: '下一步', new_password_label: '新密碼', confirm_password_label: '確認新密碼',
    password_check: '請輸入密碼', password_match: '密碼一致 ✓', password_mismatch: '密碼不一致 ✗',
    reset_password: '重置密碼', reset_success: '密碼重置成功！', reset_success_desc: '請使用新密碼登錄',
    go_login: '去登錄', remember_password: '想起密碼了？', back_login: '返回登錄',
    code_sent: '驗證碼已發送', code_verified: '驗證通過 ✓', send_again: '重新發送',
    password_short: '密碼至少需要6位'
  },
  'en': {
    forgot_title: 'Reset Password', forgot_subtitle: 'Reset your password via email verification',
    email_label: 'Registered Email', send_code: 'Get Code', verify_code_label: 'Verification Code',
    next_step: 'Next', new_password_label: 'New Password', confirm_password_label: 'Confirm New Password',
    password_check: 'Enter password', password_match: 'Passwords match ✓', password_mismatch: 'Passwords do not match ✗',
    reset_password: 'Reset Password', reset_success: 'Password Reset Successful!', reset_success_desc: 'Please log in with your new password',
    go_login: 'Go to Login', remember_password: 'Remember your password?', back_login: 'Back to Login',
    code_sent: 'Code sent', code_verified: 'Verified ✓', send_again: 'Resend',
    password_short: 'Password must be at least 6 characters'
  },
  'vi': {
    forgot_title: 'Khôi phục mật khẩu', forgot_subtitle: 'Khôi phục mật khẩu qua xác nhận email',
    email_label: 'Email đã đăng ký', send_code: 'Nhận mã', verify_code_label: 'Mã xác nhận',
    next_step: 'Tiếp theo', new_password_label: 'Mật khẩu mới', confirm_password_label: 'Xác nhận mật khẩu mới',
    password_check: 'Nhập mật khẩu', password_match: 'Mật khẩu khớp ✓', password_mismatch: 'Mật khẩu không khớp ✗',
    reset_password: 'Đặt lại mật khẩu', reset_success: 'Đặt lại mật khẩu thành công!', reset_success_desc: 'Vui lòng đăng nhập bằng mật khẩu mới',
    go_login: 'Đăng nhập', remember_password: 'Nhớ mật khẩu?', back_login: 'Quay lại đăng nhập',
    code_sent: 'Mã đã gửi', code_verified: 'Đã xác nhận ✓', send_again: 'Gửi lại',
    password_short: 'Mật khẩu cần ít nhất 6 ký tự'
  }
};

let currentLang = 'zh-CN';
let isCodeVerified = false;
let generatedCode = '';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (i18n[lang][key]) el.textContent = i18n[lang][key];
  });
}

function t(key) {
  return i18n[currentLang][key] || key;
}

function sendCode() {
  const email = document.getElementById('email').value.trim();
  if (!email || !email.includes('@')) {
    alert(t('email_invalid'));
    return;
  }
  const btn = document.getElementById('btnSendCode');
  btn.disabled = true;
  generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
  console.log('验证码:', generatedCode);
  let countdown = 60;
  const timer = setInterval(() => {
    countdown--;
    btn.textContent = `${countdown}s`;
    if (countdown <= 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = t('send_again');
    }
  }, 1000);
}

function checkCode() {
  const code = document.getElementById('verifyCode').value.trim();
  const status = document.getElementById('codeStatus');
  if (code.length === 6 && code === generatedCode) {
    isCodeVerified = true;
    status.classList.add('show');
  } else {
    isCodeVerified = false;
    status.classList.remove('show');
  }
}

function goToStep2() {
  if (!isCodeVerified) {
    alert('请先完成邮箱验证');
    return;
  }
  document.getElementById('section1').classList.remove('active');
  document.getElementById('section2').classList.add('active');
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step1').classList.add('completed');
  document.getElementById('step2').classList.add('active');
}

function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
}

function checkPasswordMatch() {
  const pwd = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const matchEl = document.getElementById('passwordMatch');
  const btn = document.getElementById('btnReset');
  if (!pwd || !confirm) {
    matchEl.className = 'password-match';
    matchEl.querySelector('.icon').textContent = '?';
    matchEl.querySelector('span:last-child').textContent = t('password_check');
    btn.disabled = true;
    return;
  }
  if (pwd.length < 6) {
    matchEl.className = 'password-match mismatch';
    matchEl.querySelector('.icon').textContent = '✗';
    matchEl.querySelector('span:last-child').textContent = t('password_short');
    btn.disabled = true;
    return;
  }
  if (pwd === confirm) {
    matchEl.className = 'password-match match';
    matchEl.querySelector('.icon').textContent = '✓';
    matchEl.querySelector('span:last-child').textContent = t('password_match');
    btn.disabled = false;
  } else {
    matchEl.className = 'password-match mismatch';
    matchEl.querySelector('.icon').textContent = '✗';
    matchEl.querySelector('span:last-child').textContent = t('password_mismatch');
    btn.disabled = true;
  }
}

function resetPassword() {
  const btn = document.getElementById('btnReset');
  btn.disabled = true;
  btn.textContent = '...';
  setTimeout(() => {
    showResult(true);
  }, 1500);
}

function showResult(success) {
  document.getElementById('section2').classList.remove('active');
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step2').classList.add('completed');
  document.getElementById('step3').classList.add('active');
  document.getElementById('section3').classList.add('active');
}

setLang('zh-CN');
</script>
</body>
</html>
