<!DOCTYPE html>
<html lang="zh-CN" data-theme="yuanshan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chuyue - 更新日志</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #A8BEDF; --primary-dark: #8ba4cf; --primary-light: #c5d4ea;
    --accent: #C7D5E8; --accent-light: #d8e2f0;
    --bg-main: #F5F7FA; --bg-sidebar: #ECF0F5; --bg-card: #F8FAFC;
    --bg-hover: rgba(168, 190, 223, 0.1); --bg-active: rgba(168, 190, 223, 0.2);
    --text-primary: #4A5060; --text-secondary: #7A8090; --text-muted: #A8B0C0; --text-light: #C8D0D8;
    --border: #D8DFE8; --border-light: #E8EDF2;
    --shadow-soft: 0 4px 20px rgba(168, 190, 223, 0.15);
    --shadow-card: 0 6px 24px rgba(74, 80, 96, 0.06);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Serif SC", serif;
    background: var(--bg-main);
    min-height: 100vh;
    color: var(--text-primary);
  }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 232px;
    background: var(--bg-sidebar);
    border-right: 1.5px solid var(--border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .sidebar-logo-icon {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    overflow: hidden; cursor: pointer; border: 2px solid var(--border-light);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: var(--bg-hover);
  }
  .sidebar-logo-text { font-family: "Great Vibes", cursive; font-size: 28px; color: var(--text-primary); }
  .sidebar-subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 20px; }
  .sidebar-section-title {
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.8px; padding: 0 8px; margin: 12px 0 6px; font-weight: 500;
  }
  .sidebar-item {
    padding: 10px 12px; border-radius: var(--radius-sm); font-size: 14px;
    color: var(--text-secondary); cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 10px; margin-bottom: 2px;
    text-decoration: none;
  }
  .sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .sidebar-item.active { background: var(--bg-active); color: var(--text-primary); font-weight: 600; }
  .sidebar-logout { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-light); }
  .sidebar-logout-btn {
    padding: 10px 12px; border-radius: var(--radius-sm); font-size: 14px;
    color: var(--text-muted); cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 10px; border: none; background: none;
    font-family: inherit; width: 100%;
  }
  .sidebar-logout-btn:hover { color: #e74c3c; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 56px; border-bottom: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; background: var(--bg-card); flex-shrink: 0;
  }
  .page-title { font-size: 18px; font-weight: 700; }
  .page-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .content { flex: 1; overflow-y: auto; padding: 32px; }

  /* 更新日志 */
  .log-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .log-title-group { display: flex; flex-direction: column; gap: 4px; }
  .log-title { font-size: 22px; font-weight: 700; }
  .log-subtitle { font-size: 13px; color: var(--text-muted); }
  .current-version {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: var(--radius-md);
    background: var(--bg-card); border: 1.5px solid var(--border);
    font-size: 13px; color: var(--text-secondary);
  }
  .version-badge {
    background: var(--primary); color: #fff; padding: 2px 8px;
    border-radius: 4px; font-size: 12px; font-weight: 600;
  }

  .log-timeline {
    position: relative;
    padding-left: 28px;
  }
  .log-timeline::before {
    content: '';
    position: absolute; left: 6px; top: 0; bottom: 0;
    width: 2px; background: var(--border-light);
  }

  .log-item {
    position: relative;
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-light);
  }
  .log-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .log-dot {
    position: absolute; left: -28px; top: 4px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg-card); border: 2.5px solid var(--primary);
    z-index: 1;
  }
  .log-item.major .log-dot { border-color: var(--primary-dark); background: var(--primary); }

  .log-card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    border: 1.5px solid var(--border); box-shadow: var(--shadow-card);
    padding: 24px;
    transition: all 0.2s;
  }
  .log-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-soft); }

  .log-header-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .log-version {
    font-size: 16px; font-weight: 700; color: var(--text-primary);
  }
  .log-tag {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; background: var(--bg-hover);
    color: var(--text-secondary);
  }
  .log-tag.major { background: var(--primary); color: #fff; }
  .log-tag.feature { background: #e8f5e9; color: #2e7d32; }
  .log-tag.fix { background: #fff3e0; color: #e65100; }
  .log-tag.optimize { background: #e3f2fd; color: #1565c0; }

  .log-date {
    margin-left: auto; font-size: 12px; color: var(--text-muted);
    font-family: monospace;
  }

  .log-content {
    font-size: 14px; line-height: 1.7; color: var(--text-secondary);
  }
  .log-content p { margin-bottom: 8px; }
  .log-content p:last-child { margin-bottom: 0; }

  /* 响应式 */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .content { padding: 20px; }
    .topbar { padding: 0 16px; }
    .log-timeline { padding-left: 20px; }
    .log-dot { left: -20px; width: 12px; height: 12px; }
    .log-card { padding: 16px; }
    .log-header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo-icon" id="sidebarAvatar" onclick="document.getElementById('sidebarAvatarInput').click()">
        <img id="sidebarAvatarImg" style="display:none;" alt="avatar">
        <span id="sidebarAvatarPlaceholder">👤</span>
      </div>
      <input type="file" id="sidebarAvatarInput" accept="image/*" onchange="handleAvatar(event)" style="display:none;">
      <span class="sidebar-logo-text">Chuyue</span>
    </div>
    <div class="sidebar-subtitle" data-i18n="tagline">文字模擬器</div>
    <div class="sidebar-section-title" data-i18n="nav_game">遊戲</div>
    <a href="index.html" class="sidebar-item"><span>🏠</span> <span data-i18n="nav_home">首頁</span></a>
    <a href="#" class="sidebar-item"><span>🎮</span> <span data-i18n="nav_game_center">遊戲中心</span></a>
    <a href="#" class="sidebar-item"><span>✨</span> <span data-i18n="nav_wish">許願看板</span></a>
    <a href="#" class="sidebar-item"><span>⚙️</span> <span data-i18n="nav_settings">系統設定</span></a>
    <div class="sidebar-section-title" data-i18n="nav_personal">個人</div>
    <a href="member.html" class="sidebar-item"><span>👤</span> <span data-i18n="nav_member">會員中心</span></a>
    <a href="update-log.html" class="sidebar-item active"><span>📋</span> <span data-i18n="nav_update">更新日誌</span></a>
    <a href="#" class="sidebar-item"><span>📧</span> <span data-i18n="nav_contact">聯繫開發者</span></a>
    <div class="sidebar-logout">
      <button class="sidebar-logout-btn" onclick="logout()" data-i18n="logout">登出</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title" data-i18n="update_log">更新日誌</div>
        <div class="page-subtitle" data-i18n="update_log_sub">系統更新記錄與版本說明</div>
      </div>
      <div class="current-version">
        <span data-i18n="current_version_label">當前版本</span>
        <span class="version-badge">v0.1.0</span>
      </div>
    </div>

    <div class="content">
      <div class="log-timeline" id="logTimeline">
        <!-- 日志条目由 JS 渲染 -->
      </div>
    </div>
  </main>
</div>

<script>
const i18n = {
  'zh-CN': {
    tagline: '文字模擬器', nav_game: '遊戲', nav_home: '首頁',
    nav_game_center: '遊戲中心', nav_wish: '許願看板', nav_settings: '系統設定',
    nav_personal: '個人', nav_member: '會員中心', nav_update: '更新日誌',
    nav_contact: '聯繫開發者', logout: '登出',
    update_log: '更新日誌', update_log_sub: '系統更新記錄與版本說明',
    current_version_label: '當前版本',
    version: '版本', update_content: '更新內容', update_time: '更新時間',
    tag_major: '重大更新', tag_feature: '新功能', tag_fix: '修復', tag_optimize: '優化'
  },
  'zh-TW': {
    tagline: '文字模擬器', nav_game: '遊戲', nav_home: '首頁',
    nav_game_center: '遊戲中心', nav_wish: '許願看板', nav_settings: '系統設定',
    nav_personal: '個人', nav_member: '會員中心', nav_update: '更新日誌',
    nav_contact: '聯繫開發者', logout: '登出',
    update_log: '更新日誌', update_log_sub: '系統更新記錄與版本說明',
    current_version_label: '當前版本',
    version: '版本', update_content: '更新內容', update_time: '更新時間',
    tag_major: '重大更新', tag_feature: '新功能', tag_fix: '修復', tag_optimize: '優化'
  },
  'en': {
    tagline: 'Text Simulator', nav_game: 'Game', nav_home: 'Home',
    nav_game_center: 'Game Center', nav_wish: 'Wish Board', nav_settings: 'Settings',
    nav_personal: 'Personal', nav_member: 'Member Center', nav_update: 'Update Log',
    nav_contact: 'Contact Developer', logout: 'Logout',
    update_log: 'Update Log', update_log_sub: 'System update records and version notes',
    current_version_label: 'Current Version',
    version: 'Version', update_content: 'Update Content', update_time: 'Update Time',
    tag_major: 'Major', tag_feature: 'Feature', tag_fix: 'Fix', tag_optimize: 'Optimize'
  },
  'vi': {
    tagline: 'Trình mô phỏng văn bản', nav_game: 'Trò chơi', nav_home: 'Trang chủ',
    nav_game_center: 'Trung tâm trò chơi', nav_wish: 'Bảng ước nguyện', nav_settings: 'Cài đặt',
    nav_personal: 'Cá nhân', nav_member: 'Trung tâm thành viên', nav_update: 'Nhật ký cập nhật',
    nav_contact: 'Liên hệ nhà phát triển', logout: 'Đăng xuất',
    update_log: 'Nhật ký cập nhật', update_log_sub: 'Lịch sử cập nhật hệ thống',
    current_version_label: 'Phiên bản hiện tại',
    version: 'Phiên bản', update_content: 'Nội dung cập nhật', update_time: 'Thời gian',
    tag_major: 'Cập nhật lớn', tag_feature: 'Tính năng mới', tag_fix: 'Sửa lỗi', tag_optimize: 'Tối ưu'
  }
};

let currentLang = 'zh-CN';

function t(key) { return i18n[currentLang][key] || key; }

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang][key]) el.textContent = i18n[lang][key];
  });
}

// 模拟更新日志数据
const updateLogs = [
  {
    version: 'v0.1.0',
    type: 'major',
    date: '2026-10-06',
    content: {
      'zh-CN': '會員中心正式上線。支持註冊、登錄、忘記密碼重置，以及會員頭像、ID管理、API模型綁定等功能。',
      'zh-TW': '會員中心正式上線。支持註冊、登錄、忘記密碼重置，以及會員頭像、ID管理、API模型綁定等功能。',
      'en': 'Member Center officially launched. Supports registration, login, password reset, avatar, ID management, and API model binding.',
      'vi': 'Trung tâm thành viên chính thức ra mắt. Hỗ trợ đăng ký, đăng nhập, đặt lại mật khẩu, quản lý ảnh đại diện và liên kết mô hình API.'
    }
  },
  {
    version: 'v0.0.2',
    type: 'feature',
    date: '2026-09-20',
    content: {
      'zh-CN': '新增國風四主題切換功能，支持繡日搖風、窗紗香灰、遠山素影、桃枝照水四種配色方案。',
      'zh-TW': '新增國風四主題切換功能，支持繡日搖風、窗紗香灰、遠山素影、桃枝照水四種配色方案。',
      'en': 'Added four Guofeng theme switching: Xiuri, Chuangsha, Yuanshan, and Taozhi.',
      'vi': 'Thêm chức năng chuyển đổi bốn chủ đề phong cách Trung Hoa cổ điển.'
    }
  },
  {
    version: 'v0.0.1',
    type: 'feature',
    date: '2026-09-01',
    content: {
      'zh-CN': 'Chuyue 文字模擬器首次發布，包含首頁、遊戲中心基礎骨架，支持四語言切換。',
      'zh-TW': 'Chuyue 文字模擬器首次發布，包含首頁、遊戲中心基礎骨架，支持四語言切換。',
      'en': 'Chuyue Text Simulator first release. Includes homepage and game center skeleton with four-language support.',
      'vi': 'Phát hành lần đầu Trình mô phỏng văn bản Chuyue. Bao gồm trang chủ và khung trung tâm trò chơi, hỗ trợ bốn ngôn ngữ.'
    }
  }
];

function getTagClass(type) {
  const map = { major: 'major', feature: 'feature', fix: 'fix', optimize: 'optimize' };
  return map[type] || 'feature';
}
function getTagText(type) {
  const map = { major: 'tag_major', feature: 'tag_feature', fix: 'tag_fix', optimize: 'tag_optimize' };
  return t(map[type] || 'tag_feature');
}

function renderLogs() {
  const container = document.getElementById('logTimeline');
  container.innerHTML = updateLogs.map(log => `
    <div class="log-item ${log.type === 'major' ? 'major' : ''}">
      <div class="log-dot"></div>
      <div class="log-card">
        <div class="log-header-row">
          <span class="log-version">${log.version}</span>
          <span class="log-tag ${getTagClass(log.type)}">${getTagText(log.type)}</span>
          <span class="log-date">${log.date}</span>
        </div>
        <div class="log-content">
          <p>${log.content[currentLang] || log.content['zh-CN']}</p>
        </div>
      </div>
    </div>
  `).join('');
}

function handleAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = document.getElementById('sidebarAvatarImg');
    const placeholder = document.getElementById('sidebarAvatarPlaceholder');
    img.src = e.target.result; img.style.display = 'block';
    placeholder.style.display = 'none';
    localStorage.setItem('chuyue_sidebar_avatar', e.target.result);
  };
  reader.readAsDataURL(file);
}

function loadAvatar() {
  const saved = localStorage.getItem('chuyue_sidebar_avatar');
  if (saved) {
    const img = document.getElementById('sidebarAvatarImg');
    const placeholder = document.getElementById('sidebarAvatarPlaceholder');
    img.src = saved; img.style.display = 'block';
    placeholder.style.display = 'none';
  }
}

function logout() {
  if (confirm(t('logout_confirm') || '確定要登出嗎？')) {
    localStorage.removeItem('chuyue_logged_in');
    location.href = 'login.html';
  }
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
  setLang('zh-CN');
  loadAvatar();
  renderLogs();
});
</script>
</body>
</html>
