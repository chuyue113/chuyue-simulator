<!DOCTYPE html>
<html lang="zh-CN" data-theme="yuanshan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chuyue - 登录</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #A8BEDF; --primary-dark: #8ba4cf; --primary-light: #c5d4ea;
    --accent: #C7D5E8; --accent-light: #d8e2f0;
    --bg-main: #F5F7FA; --bg-sidebar: #ECF0F5; --bg-card: #F8FAFC;
    --bg-hover: rgba(168, 190, 223, 0.1); --bg-active: rgba(168, 190, 223, 0.2);
    --text-primary: #4A5060; --text-secondary: #7A8090; --text-muted: #A8B0C0; --text-light: #C8D0D8;
    --border: #D8DFE8; --border-light: #E8EDF2;
    --shadow-soft: 0 4px 20px rgba(168, 190, 223, 0.15);
    --shadow-card: 0 6px 24px rgba(74, 80, 96, 0.06);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Serif SC", serif;
    background: var(--bg-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-primary);
  }
  .login-card {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-card);
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    margin: 20px;
    border: 1.5px solid var(--border);
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .login-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand {
    font-family: "Great Vibes", cursive;
    font-size: 40px;
    color: var(--primary-dark);
    margin-bottom: 8px;
  }
  .login-header h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .login-header p {
    font-size: 13px;
    color: var(--text-muted);
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .form-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-main);
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
    outline: none;
  }
  .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(168, 190, 223, 0.15);
  }
  .input-wrapper {
    position: relative;
  }
  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--text-muted);
    font-size: 16px;
    user-select: none;
  }
  .form-input.has-toggle {
    padding-right: 42px;
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-md);
    border: none;
    background: var(--text-primary);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-submit:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 16px 0;
    font-size: 13px;
  }
  .remember-me {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .remember-me input {
    accent-color: var(--primary);
  }
  .forgot-link {
    color: var(--primary-dark);
    text-decoration: none;
    font-weight: 600;
  }
  .forgot-link:hover {
    text-decoration: underline;
  }
  .form-footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }
  .form-footer a {
    color: var(--primary-dark);
    text-decoration: none;
    font-weight: 600;
  }
  .lang-switcher {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    background: var(--bg-card);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-soft);
    padding: 8px 12px;
    display: flex;
    gap: 4px;
    border: 1.5px solid var(--border);
  }
  .lang-btn {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1.5px solid transparent;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    transition: all 0.2s;
    font-family: inherit;
  }
  .lang-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  @media (max-width: 480px) {
    .login-card { margin: 12px; padding: 28px 20px; }
    .brand { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="lang-switcher">
  <button class="lang-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">繁中</button>
  <button class="lang-btn active" data-lang="zh-CN" onclick="setLang('zh-CN')">简中</button>
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
  <button class="lang-btn" data-lang="vi" onclick="setLang('vi')">Tiếng Việt</button>
</div>

<div class="login-card">
  <div class="login-header">
    <div class="brand">Chuyue</div>
    <h1 data-i18n="login_title">欢迎回来</h1>
    <p data-i18n="login_subtitle">登录您的会员账号</p>
  </div>

  <div class="form-group">
    <label class="form-label" data-i18n="email_label">邮箱地址</label>
    <input type="email" class="form-input" id="email" placeholder="example@email.com">
  </div>

  <div class="form-group">
    <label class="form-label" data-i18n="password_label">密码</label>
    <div class="input-wrapper">
      <input type="password" class="form-input has-toggle" id="password" placeholder="••••••••">
      <span class="toggle-password" onclick="togglePassword()">👁</span>
    </div>
  </div>

  <div class="form-options">
    <label class="remember-me">
      <input type="checkbox" id="remember">
      <span data-i18n="remember_me">记住我</span>
    </label>
    <a href="forgot.html" class="forgot-link" data-i18n="forgot_password">忘记密码？</a>
  </div>

  <button class="btn-submit" onclick="login()" data-i18n="login_btn">登录</button>

  <div class="form-footer">
    <span data-i18n="no_account">还没有账号？</span>
    <a href="register.html" data-i18n="register_now">立即注册</a>
  </div>
</div>

<script>
const i18n = {
  'zh-CN': {
    login_title: '欢迎回来', login_subtitle: '登录您的会员账号',
    email_label: '邮箱地址', password_label: '密码',
    remember_me: '记住我', forgot_password: '忘记密码？',
    login_btn: '登录', no_account: '还没有账号？', register_now: '立即注册'
  },
  'zh-TW': {
    login_title: '歡迎回來', login_subtitle: '登錄您的會員賬號',
    email_label: '郵箱地址', password_label: '密碼',
    remember_me: '記住我', forgot_password: '忘記密碼？',
    login_btn: '登錄', no_account: '還沒有賬號？', register_now: '立即註冊'
  },
  'en': {
    login_title: 'Welcome Back', login_subtitle: 'Sign in to your account',
    email_label: 'Email', password_label: 'Password',
    remember_me: 'Remember me', forgot_password: 'Forgot password?',
    login_btn: 'Sign In', no_account: 'No account?', register_now: 'Register now'
  },
  'vi': {
    login_title: 'Chào mừng trở lại', login_subtitle: 'Đăng nhập tài khoản',
    email_label: 'Email', password_label: 'Mật khẩu',
    remember_me: 'Ghi nhớ', forgot_password: 'Quên mật khẩu?',
    login_btn: 'Đăng nhập', no_account: 'Chưa có tài khoản?', register_now: 'Đăng ký ngay'
  }
};

let currentLang = 'zh-CN';

function t(key) {
  return (i18n[currentLang] && i18n[currentLang][key]) || key;
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (i18n[lang][key]) el.textContent = i18n[lang][key];
  });
}

function togglePassword() {
  const input = document.getElementById('password');
  input.type = input.type === 'password' ? 'text' : 'password';
}

function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const btn = document.querySelector('.btn-submit');
  
  // 骨架阶段：允许空字段演示登录流程
  if (!email && !password) {
    console.log('骨架演示模式：跳过验证直接登录');
  }
  
  btn.textContent = t('logging_in') || '登录中...';
  btn.disabled = true;
  btn.style.opacity = '0.7';
  
  setTimeout(() => {
    localStorage.setItem('chuyue_logged_in', 'true');
    localStorage.setItem('chuyue_email', email || 'demo@chuyue.app');
    location.href = 'member.html';
  }, 800);
}

setLang('zh-CN');
</script>
</body>
</html>
